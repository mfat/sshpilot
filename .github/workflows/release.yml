name: Release

# Manual, non-interactive twin of scripts/release.sh: bump the version on
# main, tag, and push. The tag push is what makes the existing build-deb /
# build-rpm / macOS / flathub workflows run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 5.5.8'
        required: true
        type: string
      changelog:
        description: 'Release notes, one per line. Leave empty to derive them from the commits since the last release.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release (skips APT/Homebrew/Flathub)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Branch to bump, tag and release'
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # A tag pushed with the default GITHUB_TOKEN does NOT trigger the
      # `on: push: tags` workflows, so the release would build nothing. Check out
      # (and therefore push) with a PAT instead.
      - name: Check the release token
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.PPA_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No RELEASE_TOKEN (or PPA_TRIGGER_TOKEN) secret is set."
            echo "::error::A PAT is required: tags pushed with GITHUB_TOKEN do not trigger the build workflows."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.PPA_TRIGGER_TOKEN }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # dch writes debian/changelog, which is the version of record for the PPA.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Validate the version
        id: check
        run: |
          set -eu
          VERSION='${{ inputs.version }}'
          VERSION=${VERSION#v}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          # Read the version currently on the release branch. If the bump is
          # already there (committed by hand, or by an older run that pushed
          # it without the tag), skip re-bumping and just tag.
          CURRENT=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/sshpilot/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"""__version__\s*=\s*['"]([^'"]+)['"]""", text)
          print(match.group(1) if match else "0.0.0")
          PY
          )
          if [ "$VERSION" = "$CURRENT" ]; then
            ALREADY_BUMPED=true
            # Changelog derivation still wants the prior release tag.
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
            PREVIOUS=${PREVIOUS#v}
            if [ -z "$PREVIOUS" ]; then
              echo "::error::Could not determine the previous release tag."
              exit 1
            fi
            echo "Version already bumped to $VERSION; tagging it."
          else
            ALREADY_BUMPED=false
            # Same semver + must-increase rules the interactive helper applies.
            PREVIOUS=$(scripts/bump-version.sh --check "$VERSION")
            echo "Releasing $PREVIOUS -> $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "already_bumped=$ALREADY_BUMPED" >> "$GITHUB_OUTPUT"

      - name: Assemble the changelog
        id: changelog
        env:
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          set -eu
          if [ -n "${INPUT_CHANGELOG//[[:space:]]/}" ]; then
            printf '%s\n' "$INPUT_CHANGELOG" > ${RUNNER_TEMP}/changelog.txt
          else
            # Fall back to the commit subjects since the previous release, minus
            # the housekeeping ones nobody wants in GNOME Software.
            git log --no-merges --pretty=%s "v${PREVIOUS}..HEAD" \
              | grep -vEi '^(chore|ci|test|docs|refactor)[(:]|^Bump version to |^Merge ' \
              > ${RUNNER_TEMP}/changelog.txt || true
          fi
          if [ ! -s ${RUNNER_TEMP}/changelog.txt ]; then
            echo "::error::Changelog is empty and nothing could be derived from the commits."
            exit 1
          fi
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/changelog.txt"

      - name: Bump the version
        if: steps.check.outputs.already_bumped != 'true'
        run: scripts/bump-version.sh '${{ steps.check.outputs.version }}' < ${RUNNER_TEMP}/changelog.txt

      - name: Commit the bump
        if: steps.check.outputs.already_bumped != 'true'
        run: git commit -am "Bump version to ${{ steps.check.outputs.version }}"

      # Branch and tag go up in one atomic push: a rejected branch push (main
      # moved while this ran) leaves no orphan tag behind. Rerun the release
      # after pulling; the version check then starts from the new main.
      - name: Tag and push
        run: |
          set -eu
          VERSION='${{ steps.check.outputs.version }}'
          # Match scripts/release.sh: two -m paragraphs (title + body).
          # Git rejects combining -m with -F.
          git tag -a "v$VERSION" \
            -m "SSH Pilot v$VERSION" \
            -m "$(cat "${RUNNER_TEMP}/changelog.txt")"
          git push --atomic origin 'HEAD:${{ inputs.branch }}' "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.PPA_TRIGGER_TOKEN }}
        run: |
          set -eu
          VERSION='${{ steps.check.outputs.version }}'
          # SignPath Foundation requires release pages to link the code
          # signing policy; the changelog itself stays as written.
          NOTES="${RUNNER_TEMP}/release-notes.md"
          cp "${RUNNER_TEMP}/changelog.txt" "$NOTES"
          # The release RPMs are unsigned, and RPM 6.1 (Fedora 45+) refuses
          # unsigned packages under plain `rpm -U`; dnf installs them (#1383).
          printf '\n---\nWindows installer: [Code signing policy](https://sshpilot.app/code-signing.html) · [Privacy](https://sshpilot.app/privacy.html)\n' >> "$NOTES"
          printf '\nFedora/RHEL: install the .rpm with `sudo dnf install ./sshpilot-*.rpm` (plain `rpm -U` rejects it on Fedora 45+ as unsigned), or use the [COPR repository](https://copr.fedorainfracloud.org/coprs/mahdif62/sshpilot/).\n' >> "$NOTES"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            ARGS=(
              release edit "v$VERSION"
              --title "SSH Pilot v$VERSION"
              --notes-file "$NOTES"
            )
            if [ '${{ inputs.prerelease }}' = 'true' ]; then
              ARGS+=(--prerelease --latest=false)
            else
              ARGS+=(--prerelease=false)
            fi
          else
            ARGS=(
              release create "v$VERSION"
              --verify-tag
              --title "SSH Pilot v$VERSION"
              --notes-file "$NOTES"
            )
            if [ '${{ inputs.prerelease }}' = 'true' ]; then
              ARGS+=(--prerelease --latest=false)
            fi
          fi
          gh "${ARGS[@]}"

      # Runs after the tag is pushed: the PKGBUILD checksum covers the tarball
      # GitHub generates for the tag, so it lands one commit after the tag.
      - name: Update the Arch PKGBUILD
        run: |
          set -eu
          VERSION='${{ steps.check.outputs.version }}'
          scripts/update-arch-pkgbuild.sh "$VERSION"
          git commit -am "Update Arch PKGBUILD for v$VERSION"
          git push origin 'HEAD:${{ inputs.branch }}'

      # Publish that PKGBUILD to the AUR package `sshpilot`. Nothing on the AUR
      # side follows releases: users' AUR helpers only see a new version once
      # a new .SRCINFO is pushed. The key is a CI-only one registered on the
      # mfat AUR account. Non-fatal, like the PPA nudge: the release is already
      # out, and the AUR can be pushed by hand.
      - name: Check for the AUR key
        id: aur
        if: inputs.prerelease != true
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AUR_SSH_PRIVATE_KEY secret; skipping the AUR push."
          fi

      - name: Publish to the AUR
        if: steps.aur.outputs.publish == 'true'
        continue-on-error: true
        # v4.2.0, pinned by commit: this step is handed the AUR key.
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: sshpilot
          pkgbuild: packaging/ArchLinux/PKGBUILD
          commit_username: mfat
          commit_email: 423263+mfat@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ steps.check.outputs.version }}

      # Same nudge scripts/release.sh gives: without it the release reaches
      # ppa:mfat/sshpilot only after Launchpad's scheduled import + daily
      # recipe build (up to a day later). Non-fatal for the same reason.
      - name: Trigger the Launchpad PPA build
        if: inputs.prerelease != true
        continue-on-error: true
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
        run: |
          set -eu
          if [ -z "$LP_CREDENTIALS" ]; then
            echo "No LP_CREDENTIALS secret; skipping the PPA nudge."
            exit 0
          fi
          printf '%s' "$LP_CREDENTIALS" > "$RUNNER_TEMP/lp-creds.txt"
          pip install --quiet launchpadlib
          LP_CREDENTIALS_FILE="$RUNNER_TEMP/lp-creds.txt" \
            scripts/trigger-ppa-build.py "$(git rev-parse HEAD)"

      - name: Summary
        run: |
          VERSION='${{ steps.check.outputs.version }}'
          KIND=release
          if [ '${{ inputs.prerelease }}' = 'true' ]; then
            KIND=pre-release
          fi
          {
            echo "### Released v$VERSION ($KIND)"
            echo
            echo "Tag \`v$VERSION\` pushed — the .deb, .rpm, macOS and Flathub workflows build from it."
            if [ "$KIND" = "pre-release" ]; then
              echo "APT / Homebrew / Flathub updates are skipped for pre-releases."
            fi
            echo
            echo '```'
            cat "$RUNNER_TEMP/changelog.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
