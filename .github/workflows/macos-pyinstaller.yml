name: Build macOS PyInstaller Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      homebrew_core_snapshot:
        description: >-
          homebrew-core commit to build against. Defaults to the pinned
          snapshot; pass another commit to test a different toolkit.
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-arm64:
    name: macOS aarch64 PyInstaller
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Homebrew dependencies
        env:
          # The bundle ships whatever Homebrew has on build day unless this is
          # pinned, so a toolkit regression can land with no change here: GTK
          # 4.24.0 drops every Fn-flagged macOS key event -- the arrow keys,
          # Home/End, PgUp/PgDn and the F-keys (GH #1266). This snapshot is the
          # last homebrew-core tree before that bump (gtk4 4.22.4, libadwaita
          # 1.9.3), and it is the same commit the Intel build uses, so both
          # architectures ship an identical stack. Move it deliberately: bump
          # the commit, build, and check the keyboard on a real Mac.
          HOMEBREW_CORE_SNAPSHOT: ${{ inputs.homebrew_core_snapshot || '4851c1f19466880a685aafb3241e4b20328a0c72' }}
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: 1
        run: |
          set -euo pipefail

          # Put homebrew/core at the snapshot. A shallow fetch of the one
          # commit is enough: with the API disabled and auto-update off, brew
          # reads formulae straight from this checkout.
          CORE="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          rm -rf "$CORE"
          mkdir -p "$CORE"
          git -C "$CORE" init -q
          git -C "$CORE" remote add origin https://github.com/Homebrew/homebrew-core
          git -C "$CORE" fetch -q --depth 1 origin "$HOMEBREW_CORE_SNAPSHOT"
          git -C "$CORE" checkout -q FETCH_HEAD
          echo "homebrew/core pinned at $(git -C "$CORE" rev-parse HEAD)"

          # --force-bottle: fail loudly instead of silently compiling if the
          # snapshot ever lacks a bottle for this runner.
          brew install --overwrite --force-bottle python@3.13 gtk4 libadwaita \
            vte3 gtksourceview5 adwaita-icon-theme gobject-introspection \
            pygobject3 py3cairo create-dmg sshpass
          brew link --overwrite libadwaita

          # Shipped next to the DMG so a later "which toolkit was this built
          # with?" is a file lookup, not a CI-log dig.
          {
            echo "runner=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "homebrew_core_snapshot=$(git -C "$CORE" rev-parse HEAD)"
            brew list --versions
          } > build-env.txt
          echo "=== Toolkit versions ==="
          brew list --versions gtk4 libadwaita vte3 gtksourceview5 glib pygobject3

      - name: Prepare Homebrew virtual environment
        run: |
          echo "=== DEBUG: Preparing virtual environment ==="
          PYTHON_PATH="$(brew --prefix python@3.13)/bin/python3.13"
          echo "=== DEBUG: Python path: $PYTHON_PATH ==="
          echo "=== DEBUG: Creating virtual environment ==="
          "$PYTHON_PATH" -m venv .venv-homebrew --system-site-packages
          echo "=== DEBUG: Activating virtual environment ==="
          source .venv-homebrew/bin/activate
          echo "=== DEBUG: Python version in venv: $(python --version) ==="
          echo "=== DEBUG: Upgrading pip and wheel ==="
          python -m pip install --upgrade pip wheel
          echo "=== DEBUG: Installing Python packages ==="
          python -m pip install cryptography keyring psutil certifi pykeepass PyInstaller pyinstaller-hooks-contrib
          echo "=== DEBUG: Verifying Python package installations ==="
          pip list | grep -E "(cryptography|keyring|psutil|certifi|PyInstaller|pyinstaller-hooks-contrib)"
          echo "=== DEBUG: Virtual environment setup completed ==="

      - name: Build application bundle with PyInstaller
        run: |
          echo "=== DEBUG: Starting PyInstaller build ==="
          BREW_PREFIX="$(brew --prefix)"
          echo "=== DEBUG: Homebrew prefix: $BREW_PREFIX ==="
          echo "=== DEBUG: Setting environment variables ==="
          export PATH="$BREW_PREFIX/bin:$PATH"
          export GI_TYPELIB_PATH="$BREW_PREFIX/lib/girepository-1.0"
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib:$DYLD_LIBRARY_PATH"
          export PKG_CONFIG_PATH="$BREW_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export XDG_DATA_DIRS="$BREW_PREFIX/share:$XDG_DATA_DIRS"
          echo "=== DEBUG: Environment variables set ==="
          echo "PATH: $PATH"
          echo "GI_TYPELIB_PATH: $GI_TYPELIB_PATH"
          echo "DYLD_LIBRARY_PATH: $DYLD_LIBRARY_PATH"
          echo "PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
          echo "XDG_DATA_DIRS: $XDG_DATA_DIRS"
          echo "=== DEBUG: Checking pyinstaller.sh script ==="
          ls -la packaging/pyinstaller/pyinstaller.sh
          chmod +x packaging/pyinstaller/pyinstaller.sh
          echo "=== DEBUG: Running PyInstaller build ==="
          ./packaging/pyinstaller/pyinstaller.sh
          echo "=== DEBUG: PyInstaller build completed ==="

      - name: Verify sshpass bundled correctly
        run: |
          SSHPASS_PATH="dist/SSHPilot.app/Contents/Resources/bin/sshpass"
          echo "=== CHECK: Verifying sshpass bundle at $SSHPASS_PATH ==="
          if [ ! -f "$SSHPASS_PATH" ]; then
            echo "=== ERROR: sshpass NOT found at expected path: $SSHPASS_PATH ==="
            echo "=== Searching entire bundle for sshpass: ==="
            find dist/SSHPilot.app -name "sshpass" 2>/dev/null || echo "sshpass not found anywhere in bundle"
            exit 1
          fi
          echo "=== CHECK: sshpass found ==="
          ls -la "$SSHPASS_PATH"
          file "$SSHPASS_PATH"
          if [ ! -x "$SSHPASS_PATH" ]; then
            echo "=== ERROR: sshpass is not executable ==="
            exit 1
          fi
          echo "=== CHECK: sshpass is executable ==="
          if ! file "$SSHPASS_PATH" | grep -q "arm64"; then
            echo "=== ERROR: sshpass does not contain arm64 slice — architecture mismatch ==="
            exit 1
          fi
          echo "=== CHECK: sshpass arm64 architecture verified ==="

      - name: Determine artifact names
        id: artifact-info
        run: |
          echo "=== DEBUG: Determining artifact names ==="
          echo "=== DEBUG: Reading version from src/sshpilot/__init__.py ==="
          VERSION=$(grep -o '__version__ = "[^"]*"' src/sshpilot/__init__.py | cut -d'"' -f2)
          echo "=== DEBUG: Extracted version: '$VERSION' ==="
          if [ -z "$VERSION" ]; then
            echo "=== DEBUG: Version is empty, using date ==="
            VERSION=$(date +%Y%m%d)
            echo "=== DEBUG: Using date as version: '$VERSION' ==="
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=sshPilot-macOS-${VERSION}-aarch64.dmg" >> "$GITHUB_OUTPUT"
          echo "=== DEBUG: Final version: '$VERSION' ==="
          echo "=== DEBUG: DMG name: 'sshPilot-macOS-${VERSION}-aarch64.dmg' ==="

      - name: Verify build outputs
        run: |
          echo "=== DEBUG: Verifying build outputs ==="
          echo "=== DEBUG: Checking if dist directory exists ==="
          if [ -d "dist" ]; then
            echo "=== DEBUG: dist directory exists ==="
            echo "=== DEBUG: Contents of dist directory ==="
            ls -la dist/
            echo "=== DEBUG: Recursive listing of dist directory ==="
            ls -R dist/
            echo "=== DEBUG: Checking for SSHPilot.app ==="
            if [ -d "dist/SSHPilot.app" ]; then
              echo "=== DEBUG: SSHPilot.app exists ==="
              echo "=== DEBUG: SSHPilot.app size: $(du -sh dist/SSHPilot.app) ==="
            echo "=== DEBUG: SSHPilot.app structure ==="
            find dist/SSHPilot.app -name "*.so" -o -name "*.dylib" -o -name "SSHPilot" | head -20
            echo "=== DEBUG: Checking for gtksourceview5 files ==="
            if [ -e "dist/SSHPilot.app/Contents/Frameworks/libgtksourceview-5.0.dylib" ] \
               || ls dist/SSHPilot.app/Contents/Frameworks/libgtksourceview-5*.dylib >/dev/null 2>&1; then
              echo "=== DEBUG: Found gtksourceview5 at Frameworks root (required for GI) ==="
              ls -la dist/SSHPilot.app/Contents/Frameworks/libgtksourceview-5*.dylib
            else
              echo "=== DEBUG: ERROR - libgtksourceview-5 missing from Contents/Frameworks/ ==="
              echo "=== DEBUG: Nested Frameworks/Frameworks copies are NOT loaded by GI ==="
              find dist/SSHPilot.app -name "*gtksourceview*" || true
              exit 1
            fi
            echo "=== DEBUG: Checking for gtksourceview5 share data ==="
            if [ -d "dist/SSHPilot.app/Contents/Resources/share/gtksourceview-5" ]; then
              echo "=== DEBUG: Found gtksourceview5 share data ==="
              ls -la dist/SSHPilot.app/Contents/Resources/share/gtksourceview-5/ | head -10
            else
              echo "=== DEBUG: WARNING - gtksourceview5 share data directory not found ==="
            fi
            else
              echo "=== DEBUG: ERROR - SSHPilot.app not found ==="
            fi
            echo "=== DEBUG: Looking for DMG files ==="
            find dist -name "*.dmg" -exec echo "=== DEBUG: Found DMG: {} ===" \;
          else
            echo "=== DEBUG: ERROR - dist directory does not exist ==="
          fi
          echo "=== DEBUG: Build verification completed ==="

      - name: Smoke-test bundled daemon entrypoint
        run: |
          .venv-homebrew/bin/python scripts/verify_macos_daemon_bundle.py dist/SSHPilot.app

      # Manual dispatch only: proves a session's PTY actually spawns and
      # communicates through the real daemon/PTY path (GH #1166) — the
      # handshake check above passed on the broken 5.8.3 build, since only
      # session spawning was broken, not the daemon connection itself.
      - name: Smoke-test packaged PTY spawn (GH #1166)
        if: github.event_name == 'workflow_dispatch'
        run: |
          .venv-homebrew/bin/python scripts/verify_macos_pty_spawn.py dist/SSHPilot.app

      - name: Compress app bundle for artifact upload
        run: |
          echo "=== DEBUG: Compressing app bundle ==="
          if [ -d "dist/SSHPilot.app" ]; then
            echo "=== DEBUG: SSHPilot.app found, compressing ==="
            ditto -c -k --sequesterRsrc --keepParent dist/SSHPilot.app dist/SSHPilot.app.zip
            echo "=== DEBUG: Compression completed ==="
            echo "=== DEBUG: ZIP file size: $(du -sh dist/SSHPilot.app.zip) ==="
          else
            echo "=== DEBUG: ERROR - SSHPilot.app not found, cannot compress ==="
            exit 1
          fi

      - name: Generate DMG checksum
        run: |
          echo "=== DEBUG: Generating DMG checksum ==="
          DMG_NAME="${{ steps.artifact-info.outputs.dmg }}"
          echo "=== DEBUG: DMG name: '$DMG_NAME' ==="
          if [ -f "dist/$DMG_NAME" ]; then
            echo "=== DEBUG: DMG file exists, generating checksum ==="
            shasum -a 256 "dist/$DMG_NAME" > "dist/$DMG_NAME.sha256"
            echo "=== DEBUG: Checksum generated ==="
            cat "dist/$DMG_NAME.sha256"
          else
            echo "=== DEBUG: ERROR - DMG file '$DMG_NAME' not found ==="
            echo "=== DEBUG: Available files in dist: ==="
            ls -la dist/
            exit 1
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpilot-${{ steps.artifact-info.outputs.version }}-macos-arm64-dmg
          path: |
            dist/${{ steps.artifact-info.outputs.dmg }}
            build-env.txt
        continue-on-error: true

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpilot-${{ steps.artifact-info.outputs.version }}-macos-arm64-app
          path: dist/SSHPilot.app.zip
        continue-on-error: true

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpilot-${{ steps.artifact-info.outputs.version }}-macos-arm64-checksum
          path: dist/${{ steps.artifact-info.outputs.dmg }}.sha256
        continue-on-error: true

      - name: Debug final state
        run: |
          echo "=== DEBUG: Final workflow state ==="
          echo "=== DEBUG: Version: ${{ steps.artifact-info.outputs.version }} ==="
          echo "=== DEBUG: DMG: ${{ steps.artifact-info.outputs.dmg }} ==="
          echo "=== DEBUG: Final dist directory contents ==="
          ls -la dist/ || echo "=== DEBUG: dist directory not found ==="
          echo "=== DEBUG: Workflow completed ==="

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/${{ steps.artifact-info.outputs.dmg }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
