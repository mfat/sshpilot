name: Build AppImage

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    # Pinned, not ubuntu-latest: glibc comes from the build host, so the runner
    # image is what decides which distros can run the AppImage. 24.04 is the
    # oldest Ubuntu that carries libadwaita >= 1.5, and moving to a newer image
    # would silently raise the glibc floor for users.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Everything the AppImage bundles is taken from these packages: the build
      # tools Meson needs (same set debian/control declares), the GTK 4 stack
      # with its typelibs, and the data GTK loads by path (icon theme, SVG
      # pixbuf loader, dconf GSettings backend).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            blueprint-compiler \
            gettext \
            desktop-file-utils \
            appstream \
            libglib2.0-bin \
            libglib2.0-dev-bin \
            libgtk-4-bin \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-vte-3.91 \
            gir1.2-gtksource-5 \
            gir1.2-secret-1 \
            gir1.2-webkit-6.0 \
            adwaita-icon-theme \
            hicolor-icon-theme \
            librsvg2-common \
            dconf-gsettings-backend \
            patchelf \
            file \
            wget \
            xvfb \
            dbus-x11

      # src/sshpilot/__init__.py is the single source of truth the release
      # tooling bumps; the tag is only the trigger.
      - name: Extract version
        id: version
        run: |
          set -eu
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/sshpilot/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"""__version__\s*=\s*['"]([^'"]+)['"]""", text)
          if not match:
              raise SystemExit("no __version__ in src/sshpilot/__init__.py")
          print(match.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building sshpilot $VERSION"

      # Builds with Meson, like the .deb and .rpm, then bundles the GTK stack,
      # CPython and the pyproject.toml dependencies around it. The script
      # smoke-tests the AppDir under `env -i` before packing, so a missing
      # library or typelib fails here rather than on a user's machine.
      #
      # xvfb-run: with a display available the smoke test also renders the
      # xterm.js shell in a real WebView, which is the only way to catch a
      # WebKit whose out-of-process helpers cannot be exec'd from the bundle.
      #
      # The sysctl: the runner restricts unprivileged user namespaces and, unlike
      # a desktop Ubuntu, loads no AppArmor profile that lets bwrap bring up the
      # loopback in WebKit's sandbox, so the web process dies with
      # "bwrap: loopback: Failed RTM_NEWADDR". Lifting it on the runner keeps the
      # render check exercising the real sandbox rather than disabling it.
      - name: Build AppImage
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a packaging/appimage/build-appimage.sh \
            '${{ steps.version.outputs.version }}' \
            release-assets

      # APPIMAGE_EXTRACT_AND_RUN: the runner has no FUSE mount available. It
      # changes how the image is started, not what is in it.
      - name: Verify the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -eu
          APPIMAGE=$(ls release-assets/*.AppImage)
          "$APPIMAGE" --version
          "$APPIMAGE" --help > /dev/null

      # The real test: start the GUI against a virtual display and confirm the
      # app reports the bundled GTK/VTE stack as usable. The app runs until it
      # is killed, so timeout's 124 is the success case.
      - name: Verify the bundled GTK stack at runtime
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          set -eu
          APPIMAGE=$(ls release-assets/*.AppImage)
          cat > run-gui.sh <<EOF
          #!/bin/sh
          timeout 60 "$APPIMAGE" --verbose > startup.log 2>&1
          status=\$?
          [ "\$status" -eq 124 ] || [ "\$status" -eq 0 ]
          EOF
          chmod +x run-gui.sh
          xvfb-run -a dbus-run-session -- ./run-gui.sh
          for tool in gtk4 libadwaita vte pygobject cryptography; do
            grep -q "\[OK\] $tool" startup.log || {
              echo "::error::$tool did not load from the bundle"
              sed -n '1,120p' startup.log
              exit 1
            }
          done
          grep -E '^\s+\[(OK|WARN|FAIL)\]' startup.log

      - name: Generate checksum
        run: |
          cd release-assets
          for image in *.AppImage; do
            sha256sum "$image" > "$image.sha256"
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ steps.version.outputs.version }}
          path: release-assets/*
          retention-days: 14

      - name: Upload AppImage to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
