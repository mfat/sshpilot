name: Flatpak tests

# Builds the Flatpak from this commit with the Flathub manifest
# (scripts/flatpak-dev-manifest.py), installs it on a fresh runner and runs GUI
# tests inside it (scripts/run-flatpak-gui-tests.sh), so they exercise what
# users install, not the source tree:
# - SSH and local terminal tabs on every terminal backend the Flatpak ships;
# - a connection added in the New Connection dialog, logging in with the
#   password and the key passphrase saved there (through the secret portal);
# - every non-SSH protocol tab: telnet, serial, Docker, Podman, Kubernetes, Mosh.
# flatpak-builder's build cache (.flatpak-builder) is saved after every build
# and the newest one is restored before the next, so a push rebuilds only the
# modules that changed (normally just sshPilot). The dependencies rebuild only
# when the manifest changes them or Flathub publishes a new SDK.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Write the manifest that builds this checkout
        run: python3 scripts/flatpak-dev-manifest.py

      - name: Move the runtimes off the image layer
        # flatpak-builder updates the SDK in the image's system installation
        # before building. In a container that installation sits on overlayfs,
        # where renaming a directory that came from the image fails with
        # "Invalid cross-device link"; a build died on it. A copy on the
        # runner's disk updates normally.
        run: |
          inst="$(flatpak --system --installations)"
          du -sh "$inst"
          cp -a "$inst" "$RUNNER_TEMP/flatpak-system"
          mount --bind "$RUNNER_TEMP/flatpak-system" "$inst"

      - name: Restore the newest build cache
        # The action only restores an exact key, and a cache key is never
        # overwritten, so with a fixed key the cache froze at its first build:
        # after a Flathub SDK update every run rebuilt every module. Each build
        # saves under its own key instead and the newest one is restored here.
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-tests-${{ hashFiles('flatpak/**') }}-${{ github.run_id }}-x86_64
          restore-keys: |
            flatpak-tests-${{ hashFiles('flatpak/**') }}-
            flatpak-tests-

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: sshpilot-test.flatpak
          manifest-path: io.github.mfat.sshpilot.yaml
          # Saved under this run's key (the action appends the arch).
          cache-key: flatpak-tests-${{ hashFiles('flatpak/**') }}-${{ github.run_id }}
          restore-cache: false
          arch: x86_64
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: sshpilot-test-flatpak
          path: sshpilot-test.flatpak
          retention-days: 7

  prune-cache:
    name: Drop older build caches
    # Every build saves ~400 MB; keep only the newest for this ref so the
    # repository's 10 GB cache budget is not spent on stale copies.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_SUFFIX: -${{ github.run_id }}-x86_64
        run: |
          caches="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
              --key flatpak-tests- --limit 100 --json id,key)"
          # Delete nothing unless this run's cache was saved.
          if ! jq -e --arg s "$RUN_SUFFIX" 'any(.[]; .key | endswith($s))' <<<"$caches" >/dev/null; then
            echo "This run saved no cache; keeping the older ones"
            exit 0
          fi
          jq -r --arg s "$RUN_SUFFIX" '.[] | select(.key | endswith($s) | not) | .id' <<<"$caches" |
            while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done

  test:
    name: GUI tests inside the Flatpak
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sshpilot-test-flatpak

      - name: Install Flatpak, the runtime and the test servers' tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak xdg-desktop-portal gnome-keyring dbus xvfb xauth \
            python3-pip telnet socat picocom podman
          # Ubuntu 24.04 confines unprivileged user namespaces, which the
          # Flatpak sandbox (bubblewrap) and WebKit's sub-sandbox need.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
          flatpak install --user -y --noninteractive --bundle sshpilot-test.flatpak
          flatpak info --user io.github.mfat.sshpilot

      - name: Let the secret portal use the keyring
        # A Flatpak saves passwords through the portal, which hands the
        # sandbox a key from the keyring; nothing picks a backend on a runner.
        run: |
          mkdir -p ~/.config/xdg-desktop-portal
          printf '[preferred]\ndefault=*\norg.freedesktop.impl.portal.Secret=gnome-keyring\n' \
            > ~/.config/xdg-desktop-portal/portals.conf

      - name: Start a Kubernetes cluster
        run: |
          if ! command -v kind >/dev/null; then
            curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
            sudo install -m 0755 kind /usr/local/bin/kind
          fi
          kind create cluster --name sshpilot --wait 180s
          kubectl get --raw=/readyz

      - name: Run the GUI tests inside the Flatpak
        # Every backend the Flatpak ships must run: a missing one fails
        # instead of skipping, and so does any skipped test.
        env:
          SSHPILOT_EXPECT_BACKENDS: vte,xterm.js,gtkghostty,libghostty-vt
        run: |
          dbus-run-session -- bash -ceu '
            printf "ci" | gnome-keyring-daemon --unlock --replace --components=secrets >/dev/null
            xvfb-run -a -s "-screen 0 1400x900x24" scripts/run-flatpak-gui-tests.sh \
              tests/gui/test_terminal_backends.py \
              tests/gui/test_connection_dialog_saved_secrets.py \
              tests/gui/test_protocol_tabs.py \
              --junitxml="$RUNNER_TEMP/flatpak-tests.xml"
          '
          skipped="$(grep -o "<skipped[^>]*message=\"[^\"]*\"" "$RUNNER_TEMP/flatpak-tests.xml" || true)"
          if [ -n "$skipped" ]; then
            echo "$skipped"
            echo "::error::A test skipped inside the Flatpak; every one must run in CI"
            exit 1
          fi
