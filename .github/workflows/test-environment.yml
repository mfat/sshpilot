name: Test environment

# Builds the test-environment image (real mosh/kubectl/kind/docker/socat/picocom)
# and runs the complete headless suite when a release is tagged, not on every
# pull-request update. It can also be started manually when a change needs
# integration coverage before release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      virtual_fido_only:
        description: Run only the hosted virtual-FIDO capability job
        required: false
        type: boolean
        default: false

concurrency:
  group: test-env-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containerized-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.virtual_fido_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build test environment image
        run: docker build -f tests/test-environment.Dockerfile -t sshpilot-test-env .

      - name: Run pytest (incl. real-tool integration) in the container
        # Mount the repo at /work and the host docker socket so the docker-exec
        # integration test can talk to the runner's daemon. --shm-size gives
        # /dev/shm room for a tmpfs basetemp (default is 64m); basetemp lives on
        # tmpfs because pytest_sessionfinish's cleanup_dead_symlinks walks a
        # "<testname>current" symlink per unique tmp_path-using test name, and at
        # ~5k items that's thousands of resolve() syscalls -- slow enough on a
        # regular disk-backed /tmp to blow the job timeout.
        # Docker mounts /dev/shm noexec, which breaks every test that execs a
        # helper out of tmp_path (askpass, pinentry, frozen-build shims), so
        # basetemp is a dedicated exec tmpfs instead. Tests run as the runner
        # user, not root: root ignores file modes, so permission-denied tests
        # cannot fail the way they should. The docker socket's group is added
        # so the sibling-container fixtures still reach the daemon.
        # virtual_fido requires runner-level UHID/hidraw setup and an
        # explicitly built pando85 binary; the dedicated job below provisions
        # that capability and runs it independently.
        run: |
          docker run --rm \
            --network=host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c %g /var/run/docker.sock)" \
            --tmpfs /pytest-tmp:exec,mode=1777,size=2g \
            -e HOME=/pytest-tmp/home \
            -v "$PWD":/work -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            sshpilot-test-env \
            pytest -ra -m "not gui and not virtual_fido" --basetemp=/pytest-tmp/basetemp

  gui-basics:
    name: Basic app functions in a real window
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.virtual_fido_only != true }}
    # Ubuntu 24.04 ships libadwaita 1.5, the oldest version the packages
    # support, so this also proves the app still starts on the minimum stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK stack and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-venv \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 \
            gir1.2-gtksource-5 gir1.2-secret-1 \
            openssh-client xvfb dbus gnome-keyring

      - name: Install Python test dependencies
        # --system-site-packages keeps the distro's PyGObject visible.
        run: |
          python3 -m venv --system-site-packages .venv-gui
          .venv-gui/bin/pip install -r requirements-dev.txt

      - name: Log in with a password, a key and a passphrase key, and open a local shell
        # Each test drives the real main window on Xvfb against a disposable
        # sshd container and waits for output only a running shell produces.
        # A D-Bus session with an unlocked gnome-keyring gives the app a real
        # Secret Service, so saving a password and filling it in is covered too.
        env:
          SSHPILOT_GUI_TESTS: "1"
        run: |
          dbus-run-session -- bash -ceu '
            printf "ci" | gnome-keyring-daemon --unlock --replace --components=secrets >/dev/null
            xvfb-run -a -s "-screen 0 1400x900x24" \
              .venv-gui/bin/python -m pytest -ra -o addopts="" -n0 -m gui \
                tests/gui/test_basic_app_functions.py \
                "tests/gui/test_phase14_auth_dialogs.py::test_password_dialog_without_auth_helper" \
                "tests/gui/test_phase14_terminal_integration.py::test_connect_via_terminal_manager_daemon_route"
          '

  virtual-fido:
    name: Virtual HID FIDO (hosted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable and inspect UHID
        shell: bash
        run: |
          set -euo pipefail
          echo "Kernel: $(uname -a)"
          lsmod | grep '^uhid' || true
          ls -l /dev/uhid || true
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" pkg-config libudev-dev
          sudo modprobe uhid
          test -c /dev/uhid
          ls -l /dev/uhid
          hidraw_major="$(awk '$2 == "hidraw" { print $1; exit }' /proc/devices)"
          test -n "$hidraw_major"
          echo "HIDRAW_MAJOR=$hidraw_major" >> "$GITHUB_ENV"
          echo "Detected hidraw major: $hidraw_major"

      - name: Build pinned pando85 authenticator
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          pando_dir="$RUNNER_TEMP/pando-soft-fido2"
          pando_commit=7249dcb5bd7cee0b4f6bf61ff5e7c23bb43fc665
          git clone --filter=blob:none https://github.com/pando85/soft-fido2.git "$pando_dir"
          git -C "$pando_dir" fetch --depth=1 origin "$pando_commit"
          git -C "$pando_dir" checkout --detach "$pando_commit"
          test "$(git -C "$pando_dir" rev-parse HEAD)" = "$pando_commit"
          cargo build --release --example virtual_authenticator --manifest-path "$pando_dir/Cargo.toml"
          pando_bin="$pando_dir/target/release/examples/virtual_authenticator"
          test -x "$pando_bin"
          echo "PANDO_BIN=$pando_bin" >> "$GITHUB_ENV"
          echo "Built pando85 commit: $(git -C "$pando_dir" rev-parse HEAD)"

      - name: Build SSH Pilot test image
        run: docker build -f tests/test-environment.Dockerfile -t sshpilot-test-env .

      - name: Verify virtual HID inside test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network=host \
            --user root \
            --device=/dev/uhid \
            --device-cgroup-rule="c ${HIDRAW_MAJOR}:* rwm" \
            -v /dev:/dev \
            -v "$PANDO_BIN":/usr/local/bin/pando-auth:ro \
            sshpilot-test-env \
            sh -ceu '
              before="$(find /dev -maxdepth 1 -name "hidraw*" -printf "%f\n" | sort)"
              /usr/local/bin/pando-auth >/tmp/pando.log 2>&1 &
              pid=$!
              cleanup() {
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                after="$(find /dev -maxdepth 1 -name "hidraw*" -printf "%f\n" | sort)"
                test "$before" = "$after" || {
                  echo "hidraw device remained after shutdown" >&2
                  exit 1
                }
              }
              trap cleanup EXIT
              for _ in $(seq 1 30); do
                listing="$(fido2-token -L 2>&1 || true)"
                printf "%s\n" "$listing"
                if printf "%s\n" "$listing" | grep -q "vendor=0x1234" &&
                   printf "%s\n" "$listing" | grep -q "product=0x5678"; then
                  device="$(printf "%s\n" "$listing" | awk -F: "/vendor=0x1234/ {print \$1; exit}")"
                  fido2-token -I "$device"
                  exit 0
                fi
                sleep 1
              done
              cat /tmp/pando.log >&2
              exit 1
            '

      - name: Run the virtual-FIDO SSH Pilot test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network=host \
            --shm-size=2g \
            --user root \
            --device=/dev/uhid \
            --device-cgroup-rule="c ${HIDRAW_MAJOR}:* rwm" \
            -v /dev:/dev \
            -v "$PWD":/work -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PANDO_BIN":/usr/local/bin/pando-auth:ro \
            -e SSHPILOT_CANONICAL_TEST_ENV=1 \
            -e SSHPILOT_PANDO_SOFT_FIDO2=/usr/local/bin/pando-auth \
            sshpilot-test-env \
            pytest -o addopts="" -m virtual_fido \
              tests/mcp/test_runtime_fido_virtual_hid.py -vv -n 0
