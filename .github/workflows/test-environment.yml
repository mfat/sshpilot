name: Test environment

# Builds the test-environment image (real mosh/kubectl/kind/docker/socat/picocom)
# and runs the complete headless suite at the pre-merge/nightly gates, not on
# every pull-request update. It can also be started manually when a change needs
# integration coverage before entering the merge queue.

on:
  merge_group:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: test-env-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containerized-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build test environment image
        run: docker build -f tests/test-environment.Dockerfile -t sshpilot-test-env .

      - name: Run pytest (incl. real-tool integration) in the container
        # Mount the repo at /work and the host docker socket so the docker-exec
        # integration test can talk to the runner's daemon.
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            sshpilot-test-env \
            pytest -ra -m "not gui"
