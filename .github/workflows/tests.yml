name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up canonical artifact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (no GTK)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install paramiko cryptography keyring psutil

      - name: Check generated API documentation artifacts
        run: python scripts/generate_api_artifacts.py --check

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Tests stub gi.repository in tests/conftest.py and never load real GTK,
      # so we skip PyGObject / pycairo entirely (--no-deps) and install only
      # the runtime libs the test suite actually exercises through sshpilot.
      - name: Install project (no GTK) and test deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install \
            paramiko \
            cryptography \
            keyring \
            psutil \
            pytest \
            pytest-cov \
            pytest-xdist \
            jsonschema

      # Unit suite only — the `integration` tests run the real tool binaries and
      # live in the containerized "Test environment" workflow.
      # pytest-cov is already installed above; emit a coverage summary so the
      # least-covered modules are visible (informational, does not fail the run).
      # basetemp on tmpfs (/dev/shm): pytest_sessionfinish's cleanup_dead_symlinks
      # walks a "<testname>current" symlink per unique tmp_path-using test name in
      # basetemp, and at ~5k items that's thousands of resolve() syscalls -- slow
      # enough on the runner's regular disk to blow the job timeout. RAM-backed
      # basetemp keeps that cleanup fast regardless of suite size.
      - name: Run pytest
        run: >
          pytest -ra -m "not integration and not gui"
          --basetemp=/dev/shm/pytest-tmp
          --cov=sshpilot --cov-report=term-missing --cov-report=xml
