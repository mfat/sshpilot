# Global header comment — must survive any edit
Include fragments/*.conf

Host web
    HostName example.com
    User alice
    Port 22
    IdentityFile ~/.ssh/id_ed25519
    IdentityFile ~/.ssh/id_rsa
    CertificateFile ~/.ssh/web-cert.pub
    LocalForward 8080 localhost:80
    LocalForward 9090 10.0.0.5:9090
    RemoteForward 6000 localhost:5900
    DynamicForward 1080
    ProxyJump bastion
    ForwardAgent yes
    RequestTTY force
    LocalCommand echo connected
    RemoteCommand tmux attach
    UnknownDirective hello world

Host "two words" plain
    HostName spaced.example.com

Match host *.internal
    User matchuser
    GSSAPIAuthentication no

Host *.wild
    User wilduser

Host !negated
    User never

Host db jump
    HostName=db.internal
    User dbuser

Host inline
    Include more/inline.conf
    HostName inline.example.com

Host tail
    HostName tail.example.com
