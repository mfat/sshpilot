[pytest]
testpaths = tests
norecursedirs = .flatpak-builder builddir build dist .venv venv .git *.egg-info manual .hypothesis
markers =
    integration: Slow tests that exercise real tools, processes, sockets, containers, or cross-component integration.
    virtual_fido: Requires Linux UHID, dynamic hidraw access, fido2-tools, and a pando85 authenticator binary.
    e2e: End-to-end UI tests that drive the real app through Dogtail/AT-SPI.
        Opt-in only; run with SSHPILOT_E2E_TESTS=1 pytest -m e2e -p no:xdist
        (needs a graphical session with an accessibility bus). See
        tests/e2e/README.md.
    gui: Real-GTK GUI tests that boot the app on a display. Opt-in only; run with
        SSHPILOT_GUI_TESTS=1 pytest -m gui (auto-skip without PyGObject + a display).
    stress: Heavier Hypothesis property-based stress suites. Opt-in only; run with
        pytest -m stress (add SSHPILOT_SIDECAR_NIGHTLY=1 for the nightly-scale budget).
    property: Hypothesis *searches* -- they generate fresh examples every run.
        Opt-in only; run with pytest -m property. Minutes, not seconds, and the
        cost is per-run because the search is random rather than a fixed case.
        What they find is permanent: a minimized failure is promoted to a
        deterministic fixture under tests/fixtures/sidecar_regressions/, which
        replays in ~1s and DOES run in the ordinary suite. So the default pass
        keeps every regression these have ever caught; only the hunt for new
        ones is opt-in.
# Keep the ordinary development loop fast. Opt into heavier suites explicitly:
#   pytest -m integration       # integration/container coverage
#   pytest -m "not gui and not e2e"   # complete headless suite
#   SSHPILOT_E2E_TESTS=1 pytest tests/e2e -m e2e -o addopts=""   # AT-SPI suite
#
# worksteal, not loadgroup: a large share of these tests block -- on sleeps,
# sockets, thread joins -- rather than burn CPU, so the wall time is set by
# stragglers leaving workers idle, not by total work. Letting an idle worker
# steal queued tests beats any up-front split. -n 12 oversubscribes the 8 cores
# here for the same reason. Measured, three runs each:
#   -n auto --dist=loadgroup   ~64s   (the previous setting)
#   -n auto --dist=worksteal   ~43s
#   -n 12   --dist=worksteal   ~31s   <- this
#   -n 16   --dist=worksteal   ~34s   (past the knee)
# The failing set is identical either way: 48 failures stable across six runs.
# (tests/daemon/test_terminal_stream.py used to flake here as well; its waits
# no longer assume an unstarved machine.) Oversubscription is tuned for a
# developer box; pass -n auto on a constrained machine.
#
# worksteal ignores xdist_group, so the markers on the AST boundary scans no
# longer pin those modules to one worker. They memoise their own parses within
# each worker process, which is what actually kept them cheap.
addopts = -m "not integration and not gui and not e2e and not stress and not property" -n 12 --dist=worksteal
